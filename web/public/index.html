<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summa</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Summa</h1>
      <p class="lede">
        Send one message asking to add two integers. The reply shows that sum.
      </p>
      <form id="chat-form">
        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          rows="4"
          required
          placeholder="Add 2 and 3"
        ></textarea>
        <button type="submit" id="send">Send</button>
      </form>
      <section aria-live="polite">
        <h2>Reply</h2>
        <pre id="reply">No reply yet.</pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
